name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          python -m pip install "matplotlib>=3.8" "pytest>=8.0"
          python -m pip install -e . --no-deps

      - name: Build wheel
        run: python -m pip wheel --no-deps . -w dist

      - name: Verify installed wheel imports
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c "import pinn; import use_cases; import use_cases.thermal_barrier.run; import use_cases.electronics_cooling.run; import use_cases.viscous_flow.run; print('package imports: ok')"

      - name: Test
        run: pytest
