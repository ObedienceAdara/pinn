[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn"
version = "0.1.0"
description = "A standard PyTorch Physics-Informed Neural Network baseline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["pinn*", "use_cases*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
